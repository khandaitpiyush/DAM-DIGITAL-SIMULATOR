apiVersion: apps/v1
kind: Deployment
metadata:
  name: DAM-DIGITAL-SIMULATOR
  namespace: production
  labels:
    app.kubernetes.io/name: DAM-DIGITAL-SIMULATOR
    app.kubernetes.io/managed-by: unified-devops-platform
    app.kubernetes.io/version: "v1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: DAM-DIGITAL-SIMULATOR
  template:
    metadata:
      labels:
        app: DAM-DIGITAL-SIMULATOR
    spec:
      containers:
        - name: app
          image: ghcr.io/khandaitpiyush/DAM-DIGITAL-SIMULATOR:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false